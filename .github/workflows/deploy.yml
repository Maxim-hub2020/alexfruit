name: Deploy AlexFruit to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image on GitHub
        run: |
          docker build -t alexfruit-prod-app:latest .

      - name: Save Docker image
        run: |
          docker save alexfruit-prod-app:latest | gzip > /tmp/alexfruit-prod-app.tar.gz

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TIMEWEB_SSH_KEY }}" > ~/.ssh/timeweb_key
          chmod 600 ~/.ssh/timeweb_key
          ssh-keyscan -T 10 -p "${{ secrets.TIMEWEB_PORT }}" "${{ secrets.TIMEWEB_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare server directory
        run: |
          for i in 1 2 3 4 5; do
            echo "SSH attempt $i..."
            if timeout 90 ssh \
              -i ~/.ssh/timeweb_key \
              -p "${{ secrets.TIMEWEB_PORT }}" \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" \
              "mkdir -p /opt/alexfruit && echo DIR_OK"; then
              exit 0
            fi
            echo "SSH failed, waiting before retry..."
            sleep 15
          done
          exit 1

      - name: Upload project files to Timeweb
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".next" \
            --exclude=".env" \
            -czf /tmp/alexfruit-files.tar.gz .

          scp -i ~/.ssh/timeweb_key -P "${{ secrets.TIMEWEB_PORT }}" /tmp/alexfruit-files.tar.gz "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}:/tmp/alexfruit-files.tar.gz"

          ssh -i ~/.ssh/timeweb_key -p "${{ secrets.TIMEWEB_PORT }}" "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" '
            find /opt/alexfruit -mindepth 1 ! -name ".env" -exec rm -rf {} +
            tar -xzf /tmp/alexfruit-files.tar.gz -C /opt/alexfruit
            rm /tmp/alexfruit-files.tar.gz
          '

      - name: Upload Docker image to Timeweb
        run: |
          scp -i ~/.ssh/timeweb_key -P "${{ secrets.TIMEWEB_PORT }}" /tmp/alexfruit-prod-app.tar.gz "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}:/tmp/alexfruit-prod-app.tar.gz"

      - name: Load Docker image on Timeweb
        run: |
          ssh -i ~/.ssh/timeweb_key -p "${{ secrets.TIMEWEB_PORT }}" "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" '
            docker load < /tmp/alexfruit-prod-app.tar.gz
            rm /tmp/alexfruit-prod-app.tar.gz
          '

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/timeweb_key -p "${{ secrets.TIMEWEB_PORT }}" "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" '
            cd /opt/alexfruit &&
            docker compose -f docker-compose.prod.yml up -d
          '
