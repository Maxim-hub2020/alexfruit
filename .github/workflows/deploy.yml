name: Deploy AlexFruit to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TIMEWEB_SSH_KEY }}" > ~/.ssh/timeweb_key
          chmod 600 ~/.ssh/timeweb_key
          ssh-keyscan -T 10 -p "${{ secrets.TIMEWEB_PORT }}" "${{ secrets.TIMEWEB_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          timeout 20 ssh \
            -i ~/.ssh/timeweb_key \
            -p "${{ secrets.TIMEWEB_PORT }}" \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" \
            "echo SSH_OK"

      - name: Prepare server directory
        run: |
          timeout 20 ssh \
            -i ~/.ssh/timeweb_key \
            -p "${{ secrets.TIMEWEB_PORT }}" \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" \
            "mkdir -p /opt/alexfruit && echo DIR_OK"

      - name: Pack project
        run: |
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".next" \
            --exclude=".env" \
            -czf /tmp/alexfruit.tar.gz .

      - name: Upload archive to Timeweb
        run: |
          timeout 120 scp \
            -i ~/.ssh/timeweb_key \
            -P "${{ secrets.TIMEWEB_PORT }}" \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            /tmp/alexfruit.tar.gz \
            "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}:/tmp/alexfruit.tar.gz"

      - name: Unpack project on Timeweb
        run: |
          timeout 60 ssh \
            -i ~/.ssh/timeweb_key \
            -p "${{ secrets.TIMEWEB_PORT }}" \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" \
            "rm -rf /opt/alexfruit/* && tar -xzf /tmp/alexfruit.tar.gz -C /opt/alexfruit && rm /tmp/alexfruit.tar.gz && ls -la /opt/alexfruit"

      - name: Deploy with Docker Compose
        run: |
          timeout 300 ssh \
            -i ~/.ssh/timeweb_key \
            -p "${{ secrets.TIMEWEB_PORT }}" \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "${{ secrets.TIMEWEB_USER }}@${{ secrets.TIMEWEB_HOST }}" \
            "cd /opt/alexfruit && docker compose -f docker-compose.prod.yml up -d --build"
