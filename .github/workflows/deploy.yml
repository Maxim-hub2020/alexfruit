name: Deploy AlexFruit to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: alexfruit-production
  cancel-in-progress: true

env:
  DEPLOY_HOST: alexfruit.ru
  DEPLOY_PORT: ${{ secrets.TIMEWEB_PORT || '22' }}
  DEPLOY_USER: ${{ secrets.TIMEWEB_USER }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image on GitHub
        run: |
          docker build \
            -t alexfruit-prod-app:${{ github.sha }} \
            -t alexfruit-prod-app:latest \
            .

      - name: Pack Docker image and project files
        run: |
          docker save alexfruit-prod-app:latest | gzip > /tmp/alexfruit-prod-app.tar.gz
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".next" \
            --exclude=".env" \
            -czf /tmp/alexfruit-files.tar.gz .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.TIMEWEB_SSH_KEY }}" | tr -d '\r' > ~/.ssh/timeweb_key
          chmod 600 ~/.ssh/timeweb_key
          touch ~/.ssh/known_hosts
          ssh-keyscan -4 -T 45 -p "${{ env.DEPLOY_PORT }}" "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Prepare server directory
        run: |
          SSH_OPTS="-4 -i ~/.ssh/timeweb_key -p ${{ env.DEPLOY_PORT }} -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IPQoS=none"
          for i in 1 2 3 4; do
            echo "SSH attempt $i..."
            if timeout 75 ssh $SSH_OPTS \
              "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
              "mkdir -p /opt/alexfruit && test -f /opt/alexfruit/.env && echo DIR_OK"; then
              exit 0
            fi
            echo "SSH failed, waiting before retry..."
            sleep 15
          done
          echo "Missing /opt/alexfruit/.env or SSH is unavailable."
          exit 1

      - name: Upload release bundle to Timeweb
        run: |
          SCP_OPTS="-4 -i ~/.ssh/timeweb_key -P ${{ env.DEPLOY_PORT }} -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IPQoS=none"
          scp $SCP_OPTS /tmp/alexfruit-files.tar.gz "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/alexfruit-files.tar.gz"
          scp $SCP_OPTS /tmp/alexfruit-prod-app.tar.gz "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/alexfruit-prod-app.tar.gz"

      - name: Install release on Timeweb
        run: |
          SSH_OPTS="-4 -i ~/.ssh/timeweb_key -p ${{ env.DEPLOY_PORT }} -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IPQoS=none"
          ssh $SSH_OPTS "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" '
            set -eu
            cp /opt/alexfruit/.env /tmp/alexfruit.env
            find /opt/alexfruit -mindepth 1 ! -name ".env" -exec rm -rf {} +
            tar -xzf /tmp/alexfruit-files.tar.gz -C /opt/alexfruit
            cp /tmp/alexfruit.env /opt/alexfruit/.env
            docker load < /tmp/alexfruit-prod-app.tar.gz
            rm -f /tmp/alexfruit-files.tar.gz /tmp/alexfruit-prod-app.tar.gz /tmp/alexfruit.env
          '

      - name: Deploy with Docker Compose
        run: |
          SSH_OPTS="-4 -i ~/.ssh/timeweb_key -p ${{ env.DEPLOY_PORT }} -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=45 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IPQoS=none"
          ssh $SSH_OPTS "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" '
            set -eu
            cd /opt/alexfruit
            docker compose -p alexfruit -f docker-compose.prod.yml up -d --force-recreate db app proxy
            docker image prune -f
            docker compose -p alexfruit -f docker-compose.prod.yml ps
          '
