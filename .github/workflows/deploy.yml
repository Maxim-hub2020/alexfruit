name: Deploy AlexFruit to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, alexfruit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check server environment
        run: |
          if [ ! -f /opt/alexfruit/.env ]; then
            echo "Missing /opt/alexfruit/.env on the Timeweb server"
            exit 1
          fi

      - name: Sync project files
        run: |
          cp /opt/alexfruit/.env /tmp/alexfruit.env
          find /opt/alexfruit -mindepth 1 ! -name ".env" -exec rm -rf {} +
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude=".next" \
            --exclude=".env" \
            -cf - . | tar -xf - -C /opt/alexfruit
          cp /tmp/alexfruit.env /opt/alexfruit/.env

      - name: Build Docker image on Timeweb
        run: |
          cd /opt/alexfruit
          docker build -t alexfruit-prod-app:latest .

      - name: Deploy with Docker Compose
        run: |
          cd /opt/alexfruit
          docker compose -p alexfruit -f docker-compose.prod.yml up -d --force-recreate db app proxy
          docker image prune -f

      - name: Show container status
        run: |
          cd /opt/alexfruit
          docker compose -p alexfruit -f docker-compose.prod.yml ps
