services:
  db:
    image: postgres:16-alpine
    container_name: alexfrut-db
    environment:
      POSTGRES_DB: alexfrut
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alexfrut"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: alexfrut-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alexfrut
      JWT_SECRET: replace-with-a-long-secret
      APP_URL: http://localhost:3000
      YANDEX_MAPS_API_KEY: ""
      STORAGE_ACCESS_KEY: ""
      STORAGE_SECRET_KEY: ""
      STORAGE_BUCKET: ""
      STORAGE_ENDPOINT: ""
      LABEL_FONT_PATH: ""
      LABEL_BOLD_FONT_PATH: ""
    ports:
      - "3000:3000"
    command: >
      sh -c "npm run db:generate &&
             npx prisma migrate deploy &&
             npm run start"

volumes:
  pgdata:
